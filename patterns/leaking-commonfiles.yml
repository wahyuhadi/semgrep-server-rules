rules:
  - id: leaking-commonfiles
    patterns:
      - pattern-either:
          - pattern: |
              ...
              $X := filepath.Join(os.TempDir(), "...")
              ...
              link, err := requests.Upload($X)
    message: Detected process to leaking common files
    metadata:
      owasp:
        - A01:2021 - Supply 
      cwe:
        - "CWE-264: CWE CATEGORY: Permissions, Privileges, and Access Controls"
      references:
        - https://docs.aws.amazon.com/AmazonS3/latest/dev/WebsiteAccessPermissionsReqd.html
      category: security
      technology:
        - win
      subcategory:
        - vuln
      likelihood: HIGH
      impact: HIGH
      confidence: MEDIUM
      license: Commons Clause License Condition v1.0[LGPL-2.1-only]
      vulnerability_class:
        - Implant malware
    severity: WARNING
    languages:
      - go